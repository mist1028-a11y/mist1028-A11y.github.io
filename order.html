<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 등록</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .menu-item { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        input[type="number"] { width: 60px; padding: 5px; text-align: center; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>
    <h2>📝 주문 등록 (Supabase DB)</h2>
    <form id="orderForm">
        <div id="menuContainer"></div>
        <button type="submit">주문 완료</button>
    </form>
    <a href="index.html" class="back-link">메인으로 돌아가기</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
  

        const SUPABASE_URL = "https://zlamytsnnrgksfhqwdch.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_qdZ6alcdtNRmBGJKecWGCQ_bFTgDdUT";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const MENU = { "떡볶이": 4000, "잔치국수": 5000, "김치전": 6000, "마른안주": 10000, "골뱅이무침": 20000, "콜팝": 5000, "컵라면": 2000, "캔맥주": 3000, "막걸리": 3000, "음료": 2000 };

        const container = document.getElementById('menuContainer');
        for (const [name, price] of Object.entries(MENU)) {
            container.innerHTML += `
                <div class="menu-item">
                    <label>${name} (${price.toLocaleString()}원)</label>
                    <input type="number" name="${name}" min="0" value="0">
                </div>
            `;
        }

        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let orderData = { time: new Date().toLocaleString('ko-KR') };
            let hasItems = false;

            for (const menu in MENU) {
                let qty = parseInt(document.getElementsByName(menu)[0].value) || 0;
                orderData[menu] = qty;
                if (qty > 0) hasItems = true;
            }

            if (!hasItems) { alert("수량을 1개 이상 입력해주세요."); return; }

            // 1. 개별 가계부 테이블(hope)에 주문내역 추가
            const { error: insertError } = await supabase.from('hope').insert([orderData]);
            if (insertError) { alert("주문 기록 실패: " + insertError.message); return; }

            // 2. 누적 정산 테이블(hope2)에서 기존 수량을 가져와서 더해줌 (time은 건드리지 않음)
            const { data: currentHope2 } = await supabase.from('hope2').select('*').eq('id', 1).single();
            
            let finalUpdate = {};
            for (const menu in MENU) {
                let currentQty = currentHope2 ? (currentHope2[`주문_${menu}`] || 0) : 0;
                let newQty = parseInt(document.getElementsByName(menu)[0].value) || 0;
                finalUpdate[`주문_${menu}`] = currentQty + newQty;
            }

            const { error: updateError } = await supabase.from('hope2').update(finalUpdate).eq('id', 1);

            if (updateError) {
                alert("누적 DB 반영 실패: " + updateError.message);
            } else {
                alert("주문 등록 및 누적 합산이 완료되었습니다!");
                location.href = "stats.html";
            }
        });
    </script>
</body>
</html>
