<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 등록</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>주문 등록</h1>

<form method="POST">

<table>
    <tr>
        <th>메뉴</th>
        <th>가격</th>
        <th>수량</th>
    </tr>

    {% for item, price in menu.items() %}
    <tr>
        <td>{{ item }}</td>
        <td>{{ price }}원</td>
        <td>
            <input type="number" name="{{ item }}" min="0" value="0">
        </td>
    </tr>
    {% endfor %}
</table>

<button type="submit">주문 저장</button>

</form>
<div class="bottom-nav">
    <a href="/">🏠 홈</a>
    <a href="/order">📝 주문</a>
    <a href="/sales">💰 판매</a>
    <a href="/stats">📊 통계</a>
</div>
</body>
</html>
