<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일호프 주문현황 대시보드</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 100%; 
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .auto-refresh-status {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .control-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .refresh-btn {
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover {
            background-color: #2980b9;
        }
        .close-number-badge {
            padding: 7px 14px;
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            box-shadow: 0 2px 4px rgba(231, 76, 60, 0.3);
        }
        
        /* 🎯 [수정] 테이블 스크롤 및 고정 영역 레이아웃 */
        .table-wrapper {
            overflow-x: auto;
            max-width: 100%;
            border: 1px solid #ddd;
            /* 세로 스크롤 시 헤더가 상단에 달라붙도록 스크롤 영역 제한 (필요시 높이 조정 가능) */
            max-height: 70vh; 
        }
        table {
            width: 100%;
            border-collapse: separate; /* sticky 테두리 깨짐 방지 */
            border-spacing: 0;
            table-layout: auto;
        }
        th, td {
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 8px 4px;
            text-align: center;
            font-size: 14px;
        }
        
        /* 🎯 [핵심 CSS] 첫 번째 행(검은색 음영 헤더) 상단 고정 */
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
            height: 110px; 
            vertical-align: bottom;
            padding-bottom: 10px;
            white-space: nowrap;
            
            /* 첫 번째 가로줄 상단 틀고정 */
            position: sticky;
            top: 0;
            z-index: 10; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.15); /* 스크롤 시 아래 데이터와 구분되는 그림자 */
        }
        
        th.menu-header {
            writing-mode: vertical-rl;
            text-orientation: mixed; 
            text-align: left;
            width: 30px; 
            min-width: 30px;
            letter-spacing: 1px;
        }
        
        /* 데이터 행 스타일 */
        td {
            background-color: #fff;
        }
        tr:nth-child(even) td {
            background-color: #f9f9f9;
        }
        .empty-cell {
            color: #ccc;
        }
        .has-value {
            font-weight: bold;
            color: #e74c3c;
            background-color: #ffe6e6 !important; 
            font-size: 16px; 
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 5px;
        }
        .pagination button {
            padding: 8px 14px;
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .pagination button.active {
            background-color: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        .pagination button:disabled {
            background-color: #eee;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #7f8c8d;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍻 일일호프 주문현황</h1>
    <div class="auto-refresh-status">🔄 10초마다 자동으로 새로고침 됩니다.</div>
    
    <div class="control-panel">
        <button class="refresh-btn" onclick="fetchSheetData()">🔄 즉시 새로고침</button>
        <div id="close-number-display" class="close-number-badge">📢 주문마감번호: 확인중...</div>
    </div>
    
    <div id="loading" class="loading">주문 데이터를 불러오는 중입니다...</div>
    
    <div class="table-wrapper">
        <table id="dashboard-table" style="display: none;">
            <thead>
                <tr id="table-header"></tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzFxsQt0Jf-KTEfxVp8yeW__fMJc2lI5dEGHNfxE2JfwYB-R7xJW66-QmQs6w-at5_vWUwqWjZYCdF/pub?output=csv'; 
    
    let orderData = [];
    let headers = [];
    let currentPage = 1;
    const itemsPerPage = 10; 

    async function fetchSheetData() {
        const loadingEl = document.getElementById('loading');
        const tableEl = document.getElementById('dashboard-table');
        
        try {
            const response = await fetch(`${SHEET_CSV_URL}&t=${new Date().getTime()}`);
            if (!response.ok) throw new Error('네트워크 응답 불량');
            
            const data = await response.text();
            parseCSV(data);
            
            loadingEl.style.display = 'none';
            tableEl.style.display = 'table';
            renderTable();
        } catch (error) {
            console.error('데이터를 불러오는 중 오류 발생:', error);
            loadingEl.style.display = 'block';
            loadingEl.innerHTML = '⚠️ 데이터를 불러오지 못했습니다.<br>구글 시트의 [웹에 게시] 설정 및 형식을 다시 확인해주세요.';
        }
    }

    function splitCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim().replace(/^"|"$/g, ''));
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current.trim().replace(/^"|"$/g, ''));
        return result;
    }

    function parseCSV(text) {
        const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length === 0) return;

        const rawHeaders = splitCSVLine(lines[0]);
        
        const targetColumnIndex = 13; 
        let closeNumber = '없음';
        
        if (rawHeaders[targetColumnIndex]) {
            closeNumber = rawHeaders[targetColumnIndex];
        }
        document.getElementById('close-number-display').innerText = `📢 주문마감번호: ${closeNumber}`;

        // 13, 14열 제외
        headers = rawHeaders
            .filter((h, idx) => idx !== 12 && idx !== 13) 
            .filter(h => h.length > 0);
        
        orderData = [];
        for (let i = 1; i < lines.length; i++) {
            const currentLine = splitCSVLine(lines[i]);
            if (currentLine[0]) { 
                const filteredLine = currentLine.filter((_, idx) => idx !== 12 && idx !== 13);
                orderData.push(filteredLine);
            }
        }
        orderData.reverse(); 
    }

    function renderTable() {
        const headerRow = document.getElementById('table-header');
        const tableBody = document.getElementById('table-body');
        
        headerRow.innerHTML = '';
        headers.forEach((header, index) => {
            const th = document.createElement('th');
            th.innerText = header;
            
            if (index > 1) {
                th.classList.add('menu-header');
            }
            headerRow.appendChild(th);
        });

        tableBody.innerHTML = '';
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, orderData.length);
        const pageData = orderData.slice(startIndex, endIndex);

        if (pageData.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="${headers.length}">주문 내역이 없습니다.</td></tr>`;
            return;
        }

        pageData.forEach(row => {
            const tr = document.createElement('tr');
            
            headers.forEach((header, index) => {
                const td = document.createElement('td');
                const cell = row[index] || ''; 
                const value = cell.trim();

                if (index > 0 && value && value !== '0' && !isNaN(value)) {
                    td.innerText = value;
                    td.classList.add('has-value'); 
                } 
                else if (index > 0 && (value === '0' || !value)) {
                    td.innerText = '-';
                    td.classList.add('empty-cell'); 
                } 
                else {
                    td.innerText = value;
                }
                
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });

        renderPagination();
    }

    function renderPagination() {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';

        const totalPages = Math.ceil(orderData.length / itemsPerPage);
        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.innerText = '이전';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
            currentPage--;
            renderTable();
        };
        paginationContainer.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.innerText = i;
            if (i === currentPage) pageBtn.classList.add('active');
            pageBtn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            paginationContainer.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.innerText = '다음';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
            currentPage++;
            renderTable();
        };
        paginationContainer.appendChild(nextBtn);
    }

    window.onload = () => {
        fetchSheetData();
        setInterval(fetchSheetData, 10000); 
    };
</script>

</body>
</html>
