<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일호프 주문현황 대시보드</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 100%; 
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .auto-refresh-status {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .refresh-btn {
            display: block;
            margin: 0 auto 15px auto;
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover {
            background-color: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 4px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
            height: 110px; /* 세로 글씨 공간 확보 */
            vertical-align: bottom;
            padding-bottom: 10px;
            white-space: nowrap;
        }
        /* 🎯 글자 뒤집힘 해결 버전 세로 헤더 */
        th.menu-header {
            writing-mode: vertical-rl;
            text-orientation: mixed; /* 글자가 거꾸로 돌아가지 않게 고정 */
            text-align: left;
            width: 30px; 
            min-width: 30px;
            letter-spacing: 1px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .empty-cell {
            color: #ccc;
        }
        .has-value {
            font-weight: bold;
            color: #e74c3c;
            background-color: #ffe6e6;
            font-size: 16px; 
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 5px;
        }
        .pagination button {
            padding: 8px 14px;
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .pagination button.active {
            background-color: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        .pagination button:disabled {
            background-color: #eee;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #7f8c8d;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍻 일일호프 주문현황</h1>
    <div class="auto-refresh-status">🔄 10초마다 자동으로 새로고침 됩니다.</div>
    <button class="refresh-btn" onclick="fetchSheetData()">🔄 즉시 새로고침</button>
    
    <div id="loading" class="loading">주문 데이터를 불러오는 중입니다...</div>
    
    <div style="overflow-x: auto;">
        <table id="dashboard-table" style="display: none;">
            <thead>
                <tr id="table-header"></tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzFxsQt0Jf-KTEfxVp8yeW__fMJc2lI5dEGHNfxE2JfwYB-R7xJW66-QmQs6w-at5_vWUwqWjZYCdF/pub?output=csv'; 
    
    let orderData = [];
    let headers = [];
    let currentPage = 1;
    const itemsPerPage = 10; 

    async function fetchSheetData() {
        const loadingEl = document.getElementById('loading');
        const tableEl = document.getElementById('dashboard-table');
        
        try {
            const response = await fetch(`${SHEET_CSV_URL}&t=${new Date().getTime()}`);
            if (!response.ok) throw new Error('네트워크 응답 불량');
            
            const data = await response.text();
            parseCSV(data);
            
            loadingEl.style.display = 'none';
            tableEl.style.display = 'table';
            renderTable();
        } catch (error) {
            console.error('데이터를 불러오는 중 오류 발생:', error);
            loadingEl.style.display = 'block';
            loadingEl.innerHTML = '⚠️ 데이터를 불러오지 못했습니다.<br>구글 시트의 [웹에 게시] 설정 및 형식을 다시 확인해주세요.';
        }
    }

    function splitCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim().replace(/^"|"$/g, ''));
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current.trim().replace(/^"|"$/g, ''));
        return result;
    }

    function parseCSV(text) {
        const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length === 0) return;

        headers = splitCSVLine(lines[0]);
        
        orderData = [];
        for (let i = 1; i < lines.length; i++) {
            const currentLine = splitCSVLine(lines[i]);
            if (currentLine[0]) { 
                orderData.push(currentLine);
            }
        }
        orderData.reverse(); 
    }

    function renderTable() {
        const headerRow = document.getElementById('table-header');
        const tableBody = document.getElementById('table-body');
        
        headerRow.innerHTML = '';
        headers.forEach((header, index) => {
            const th = document.createElement('th');
            th.innerText = header;
            
            if (index > 0) {
                th.classList.add('menu-header');
            }
            headerRow.appendChild(th);
        });

        tableBody.innerHTML = '';
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, orderData.length);
        const pageData = orderData.slice(startIndex, endIndex);

        if (pageData.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="${headers.length}">주문 내역이 없습니다.</td></tr>`;
            return;
        }

        pageData.forEach(row => {
            const tr = document.createElement('tr');
            
            row.forEach((cell, index) => {
                const td = document.createElement('td');
                const value = cell.trim();
                
                if (index > 0 && value && value !== '0' && !isNaN(value)) {
                    td.innerText = value;
                    td.classList.add('has-value'); 
                } 
                else if (index > 0 && (value === '0' || !value)) {
                    td.innerText = '-';
                    td.classList.add('empty-cell'); 
                } 
                else {
                    td.innerText = value;
                }
                
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });

        renderPagination();
    }

    function renderPagination() {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';

        const totalPages = Math.ceil(orderData.length / itemsPerPage);
        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.innerText = '이전';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
            currentPage--;
            renderTable();
        };
        paginationContainer.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.innerText = i;
            if (i === currentPage) pageBtn.classList.add('active');
            pageBtn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            paginationContainer.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.innerText = '다음';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
            currentPage++;
            renderTable();
        };
        paginationContainer.appendChild(nextBtn);
    }

    window.onload = () => {
        fetchSheetData();
        setInterval(fetchSheetData, 10000); 
    };
</script>

</body>
</html>
