<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>판매 등록</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .menu-item { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        input[type="number"] { width: 60px; padding: 5px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
        th { background-color: #f1f3f5; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>
    <h2>💰 판매 등록 및 누적 현황</h2>
    
    <form id="salesForm">
        <div id="menuContainer"></div>
        <button type="submit">판매 완료 (출고)</button>
    </form>

    <h3>📊 현재까지 누적 요약</h3>
    <table>
        <thead>
            <tr>
                <th>메뉴명</th>
                <th>누적 주문량</th>
                <th>누적 판매량</th>
            </tr>
        </thead>
        <tbody id="summaryTableBody"></tbody>
    </table>

    <a href="index.html" class="back-link">메인으로 돌아가기</a>

    <script>
        const MENU = { "떡볶이": 4000, "잔치국수": 5000, "김치전": 6000, "마른안주": 10000, "골뱅이무침": 20000, "콜팝": 5000, "컵라면": 2000, "캔맥주": 3000, "막걸리": 3000, "음료": 2000 };

        // 로컬스토리지 데이터 로드 및 계산
        let orders = JSON.parse(localStorage.getItem('orders')) || [];
        let sales = JSON.parse(localStorage.getItem('sales')) || [];

        let totalOrders = {};
        let totalSales = {};
        for (const menu in MENU) {
            totalOrders[menu] = 0;
            totalSales[menu] = 0;
        }

        orders.forEach(o => { for (const [m, q] of Object.entries(o.items)) totalOrders[m] += q; });
        sales.forEach(s => { for (const [m, q] of Object.entries(s.items)) totalSales[m] += q; });

        // HTML 생성
        const container = document.getElementById('menuContainer');
        const tbody = document.getElementById('summaryTableBody');

        for (const menu in MENU) {
            // 입력 폼 생성
            container.innerHTML += `
                <div class="menu-item">
                    <label>${menu}</label>
                    <input type="number" name="${menu}" min="0" value="0">
                </div>
            `;
            // 요약 테이블 생성
            tbody.innerHTML += `
                <tr>
                    <td><b>${menu}</b></td>
                    <td>${totalOrders[menu]}</td>
                    <td>${totalSales[menu]}</td>
                </tr>
            `;
        }

        // 폼 제출
        document.getElementById('salesForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let salesRecord = {
                id: sales.length + 1,
                datetime: new Date().toLocaleString('ko-KR'),
                items: {}
            };

            for (const menu in MENU) {
                let qty = parseInt(document.getElementsByName(menu)[0].value) || 0;
                if (qty > 0) {
                    salesRecord.items[menu] = qty;
                }
            }

            if (Object.keys(salesRecord.items).length === 0) {
                alert("수량을 입력해주세요.");
                return;
            }

            sales.push(salesRecord);
            localStorage.setItem('sales', JSON.stringify(sales));
            
            alert("판매 기록이 등록되었습니다.");
            location.href = "stats.html";
        });
    </script>
</body>
</html>
